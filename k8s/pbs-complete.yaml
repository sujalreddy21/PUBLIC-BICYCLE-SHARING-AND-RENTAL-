apiVersion: v1
kind: ConfigMap
metadata:
  name: pbs-config
  labels:
    app: pbs
    tier: shared
    developer: sujal-reddy
    hall-ticket: "2303A51713"
data:
  NODE_ENV: "production"
  PORT: "5000"
  VITE_API_BASE_URL: "/api"

---
apiVersion: v1
kind: Secret
metadata:
  name: pbs-secrets
  labels:
    app: pbs
    tier: shared
    developer: sujal-reddy
    hall-ticket: "2303A51713"
type: Opaque
stringData:
  MONGODB_URI: "mongodb://mongodb-service:27017/pbs_db"
  JWT_SECRET: "pbs_super_secret_jwt_key_2026_sujal_reddy"
  JWT_EXPIRE: "30d"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
  labels:
    app: pbs
    tier: database
    developer: sujal-reddy
    hall-ticket: "2303A51713"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  labels:
    app: pbs
    tier: database
    developer: sujal-reddy
    hall-ticket: "2303A51713"
spec:
  type: ClusterIP
  ports:
    - port: 27017
      targetPort: 27017
      name: mongodb
  selector:
    app: pbs
    tier: database

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  labels:
    app: pbs
    tier: database
    developer: sujal-reddy
    hall-ticket: "2303A51713"
spec:
  type: ClusterIP
  ports:
    - port: 27017
      targetPort: 27017
      name: mongodb
  selector:
    app: pbs
    tier: database

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-deployment
  labels:
    app: pbs
    tier: database
    developer: sujal-reddy
    hall-ticket: "2303A51713"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pbs
      tier: database
  template:
    metadata:
      labels:
        app: pbs
        tier: database
    spec:
      containers:
        - name: mongodb
          image: mongo:6.0
          ports:
            - containerPort: 27017
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: mongodb-storage
              mountPath: /data/db
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: mongodb-storage
          persistentVolumeClaim:
            claimName: mongodb-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: pbs
    tier: backend
    developer: sujal-reddy
    hall-ticket: "2303A51713"
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
      name: http
  selector:
    app: pbs
    tier: backend

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  labels:
    app: pbs
    tier: backend
    developer: sujal-reddy
    hall-ticket: "2303A51713"
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
      name: http
  selector:
    app: pbs
    tier: backend

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: pbs
    tier: backend
    developer: sujal-reddy
    hall-ticket: "2303A51713"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pbs
      tier: backend
  template:
    metadata:
      labels:
        app: pbs
        tier: backend
    spec:
      containers:
        - name: backend
          image: sujalreddy/pbs-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: pbs-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: pbs-config
                  key: PORT
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: pbs-secrets
                  key: MONGODB_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pbs-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRE
              valueFrom:
                secretKeyRef:
                  name: pbs-secrets
                  key: JWT_EXPIRE
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3

