services:
  # 1. Backend REST API Service
  - type: web
    name: pbs-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 30d
      - key: MONGODB_URI
        sync: false

  # 2. Frontend React Client (Static Site on Render CDN)
  - type: web
    name: pbs-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install --no-audit --no-fund && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
